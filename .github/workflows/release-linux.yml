# Builds the Linux AppImage and .deb for a release and attaches them, with
# latest-linux.yml (which the AppImage's updater reads), to that release:
#
#   gh release create community-lab-v0.1.0 --title "Community Lab IDE 0.1.0" --notes-file notes.md
#   gh workflow run release-linux.yml -f tag=community-lab-v0.1.0
#
# The installers can also be built on a workstation (`bun run desktop:dist:linux`)
# and uploaded by hand; this is the same build on a clean runner, with a smoke
# test of the engine that ships inside them.
name: release-linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (e.g. community-lab-v0.1.0)
        required: true
      ref:
        description: Commit to build instead of the tag itself (a Linux-only fix of the same version)
        required: false
        default: ""

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The version must match the tag
        id: v
        run: |
          v="${TAG#community-lab-v}"
          have="$(node -p "require('./desktop/package.json').version")"
          root="$(node -p "require('./package.json').version")"
          if [ "$have" != "$v" ] || [ "$root" != "$v" ]; then
            echo "::error::desktop/package.json is $have and package.json is $root; the tag says $v"; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install
        run: |
          bun install --frozen-lockfile
          cd desktop && bun install --frozen-lockfile

      - name: Package the AppImage and .deb
        working-directory: desktop
        run: bun run dist:linux

      - name: Smoke test the engine inside the package
        working-directory: desktop/build/linux-unpacked/resources
        run: |
          set -x -o pipefail
          D="$RUNNER_TEMP/engine-data"; mkdir -p "$D"
          PORT=3123 COMMUNITY_DATA_DIR="$D" COMMUNITY_STATIC_DIR="$PWD/server/ui" COMMUNITY_WARM_OLLAMA=0 COMMUNITY_WORKERS=2 \
            server/community-lab-server > "$RUNNER_TEMP/engine.log" 2>&1 &
          for i in $(seq 1 60); do curl -fsS -o "$RUNNER_TEMP/health.json" http://127.0.0.1:3123/api/health && break; sleep 1; done
          grep -q '"app":"community-lab"' "$RUNNER_TEMP/health.json"
          curl -fsS http://127.0.0.1:3123/ | grep -q '<title>Community Lab IDE</title>'
          test -f LICENSE.txt
          # A pooled export: two seeds, a year each, on the engine's worker pool (a second entry point compiled in).
          id="$(curl -fsS -X POST -H 'content-type: application/json' -d '{"kind":"experience","seeds":2,"years":1}' http://127.0.0.1:3123/api/exports | node -p 'JSON.parse(require("fs").readFileSync(0)).id')"
          for i in $(seq 1 120); do
            status="$(curl -fsS "http://127.0.0.1:3123/api/exports/$id" | node -p 'const j = JSON.parse(require("fs").readFileSync(0)); j.status === "done" ? "done " + j.export.tables[0].rows.length : j.status')"
            case "$status" in done*|error*|cancelled*) break ;; esac
            sleep 2
          done
          echo "pooled export: $status"
          case "$status" in "done 0") exit 1 ;; done*) ;; *) exit 1 ;; esac

      - name: The .deb's desktop entry and metainfo
        working-directory: desktop/build
        run: |
          sudo apt-get install -y -qq desktop-file-utils appstream >/dev/null
          mkdir x && dpkg-deb -x Community-Lab-IDE-*-amd64.deb x
          desktop-file-validate x/usr/share/applications/community-lab-ide.desktop
          appstreamcli validate --no-net x/usr/share/metainfo/io.intelligentactuaries.communitylab.metainfo.xml

      - name: Attach to the release
        working-directory: desktop/build
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          sha256sum Community-Lab-IDE-"$VERSION"-*.{AppImage,deb}
          # The AppImage's blockmap is inside the file (latest-linux.yml gives its size), so there is no .blockmap to upload.
          gh release upload "$TAG" \
            "Community-Lab-IDE-$VERSION-x86_64.AppImage" \
            "Community-Lab-IDE-$VERSION-amd64.deb" \
            latest-linux.yml \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-smoke
          path: ${{ runner.temp }}/engine.log
          if-no-files-found: ignore
