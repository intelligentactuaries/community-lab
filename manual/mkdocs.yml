site_name: Community Lab IDE
site_description: A province you can run, on your machine. The user manual for Community Lab IDE, the desktop IDE for actuarial agent-based simulation.
site_url: https://docs.intelligentactuaries.com/community-lab/
# Rendered as HTML in the footer of every page. Carries the way back up to
# the hub, since this sub-site is one of several on the domain.
copyright: >-
  Copyright © 2026 Intelligent Actuaries ·
  <a href="https://docs.intelligentactuaries.com/">All documentation</a>

extra_css:
  - stylesheets/extra.css

theme:
  name: material
  language: en
  # The C₀.₁ mark (brand/generate_logo.py). The masthead is dark in both
  # schemes, so the header logo is the cream variant; the favicon follows
  # the OS, the way a browser tab should. Same arrangement as the Scelo docs.
  logo: assets/img/community-lab-mark-cream.svg
  favicon: assets/img/community-lab-icon.svg
  # overrides/main.html only adds the one-time palette reset the Scelo docs
  # carry, so every sub-site of the domain lands on the cream default.
  custom_dir: overrides
  font:
    text: Inter
    code: JetBrains Mono
  # No `media:` keys, deliberately: Material then starts a fresh visitor on
  # the first palette (cream) instead of following the OS. See the Scelo docs.
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # The model description and the assumptions are included from the
  # repository's docs/ at build time, so the manual can never disagree with
  # the files the engine's source cites.
  - pymdownx.snippets:
      base_path: [".."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  homepage: https://docs.intelligentactuaries.com/

plugins:
  - search

